name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://hotel_app:hotel_app_dev@localhost:5432/hotel_dev
      DATABASE_ADMIN_URL: postgresql://hotel_admin:hotel_admin_dev@localhost:5432/hotel_dev
      SHADOW_DATABASE_URL: postgresql://hotel_admin:hotel_admin_dev@localhost:5432/hotel_shadow
      TEST_DATABASE_URL: postgresql://hotel_app:hotel_app_dev@localhost:5432/hotel_test
      TEST_DATABASE_ADMIN_URL: postgresql://hotel_admin:hotel_admin_dev@localhost:5432/hotel_test
      # CI-only key for tests (not used anywhere real)
      APP_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create database roles and databases
        run: |
          pnpm db:setup
          psql -c "CREATE DATABASE hotel_shadow OWNER hotel_admin"

      - name: Migrations match the Prisma schema exactly (fails on any drift)
        run: pnpm db:check-drift

      - name: Apply migrations with Prisma and seed the demo hotel
        run: |
          pnpm db:migrate
          pnpm db:seed

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Browser walkthrough (new hotel set up through the screens)
        run: |
          pnpm start -p 3010 &
          npx --yes wait-on http://localhost:3010/en
          BASE_URL=http://localhost:3010 pnpm test:e2e
